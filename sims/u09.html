<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N 運算遊樂場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#0E0F12;--line:#2A2D35;--txt:#EDE6D6;--sub:#9A9384;--gold:#D4A84B;--blue:#6FA3D8;--tru:#5FB8A6;--fal:#C9644A;--m5:#8E86D6;--m6:#B98AC2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:"Noto Serif TC","PingFang TC",serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body{background-image:linear-gradient(rgba(237,230,214,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(237,230,214,.035) 1px,transparent 1px);background-size:22px 22px;min-height:100vh}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
#app{max-width:1020px;margin:0 auto;padding:12px;display:grid;gap:10px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"head head" "play goal" "play bfs"}
@media (max-width:760px){#app{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "play" "goal" "bfs";padding:10px}}
header{grid-area:head}
header h1{font-size:18px;font-weight:600;color:var(--m5)}
header p{font-size:13px;color:var(--sub);margin-top:2px}
.box{background:rgba(21,23,28,.92);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
#play{grid-area:play;display:flex;flex-direction:column;gap:8px}
#goal{grid-area:goal}
#bfs{grid-area:bfs}
h2{font-size:14px;font-weight:600;margin-bottom:6px}
button{background:#1C1F26;color:var(--txt);border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px;cursor:pointer;min-height:36px;padding:4px 12px;touch-action:manipulation}
button:active{background:#262A33}
button:disabled{opacity:.4;cursor:default}
#bN{font:600 20px "JetBrains Mono",monospace;color:var(--bg);background:var(--m5);border-color:var(--m5);min-width:120px}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#stat{font-size:13px;color:var(--sub);line-height:1.6}
#stat b{color:var(--txt)}
#msg{font-size:13px;min-height:1.4em;line-height:1.5}
#pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px;max-height:520px;overflow-y:auto;padding:2px}
.chip{border:1.5px solid var(--line);border-radius:9px;padding:6px 7px;background:#111318;cursor:pointer;min-width:0;transition:border-color .15s,background .15s}
.chip.sel{border-color:var(--gold);background:#1e1a10}
.chip.flash{animation:fl .9s}
@keyframes fl{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 3px var(--m5)}}
.chip .top{display:flex;justify-content:space-between;align-items:center;gap:4px}
.chip .id{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--sub)}
.chip .nm{font-family:"JetBrains Mono",monospace;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .ex{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--blue);margin-top:3px;word-break:break-all;line-height:1.35}
.dots{display:flex;gap:3px}
.dots i{width:10px;height:10px;border-radius:50%;display:block}
#targets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.tc{border:1px solid var(--line);border-radius:8px;padding:5px 3px;text-align:center;font-size:11px;background:#111318;cursor:pointer;min-width:0;position:relative}
.tc .dots{justify-content:center;margin-bottom:3px}
.tc .nm{font-family:"JetBrains Mono",monospace;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc .mn{font-size:10px;color:var(--sub)}
.tc.got{background:rgba(95,184,166,.16);border-color:rgba(95,184,166,.6)}
.tc.bfs{background:rgba(142,134,214,.2);border-color:var(--m5)}
.tc.tgt{box-shadow:0 0 0 2px var(--gold) inset}
.tc .ck{position:absolute;top:2px;right:4px;font-size:10px;color:var(--tru)}
#tinfo{font-size:13px;line-height:1.6;margin-top:8px;min-height:2.6em}
#tinfo .sol{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--blue);margin-top:4px}
#svg{width:100%;height:auto;display:block}
.note{font-size:12px;color:var(--sub);line-height:1.6}
label.tg{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px}
</style>
</head>
<body>
<div id="app">
  <header><h1>N 運算遊樂場</h1><p>只有一個按鈕：N(ξ̄) 在括號內全部為假時才為真（5.502、5.51）。點選命題，按 N。</p></header>

  <section id="play" class="box">
    <div class="ctrl">
      <button id="bN" disabled>N( )</button>
      <button id="bClr">取消選取</button>
      <button id="bReset">↺ 重設</button>
    </div>
    <div id="stat"></div>
    <div id="msg"></div>
    <div id="pool"></div>
    <div class="note">每張卡片的四個圓點是真值欄，由左到右 (p,q)＝(W,W)、(F,W)、(W,F)、(F,F)；青綠＝真、鏽紅＝假。真值欄相同就是同一個命題，寫法不同也一樣（5.41）。</div>
  </section>

  <section id="goal" class="box">
    <h2>16 種真值函數（5.101 順序）</h2>
    <div id="targets"></div>
    <div class="ctrl" style="margin-top:8px"><label class="tg"><input type="checkbox" id="showMin"> 顯示 BFS 最少次數</label></div>
    <div id="tinfo" class="note">點一格設為目標，試著用最少的 N 做出它。</div>
  </section>

  <section id="bfs" class="box">
    <div class="ctrl" style="justify-content:space-between"><h2 style="margin:0">自動 BFS：逐層生長</h2><button id="bBFS">▶ 自動 BFS</button></div>
    <svg id="svg" viewBox="0 0 600 330" role="img" aria-label="N 運算逐層生長圖"></svg>
    <div id="bfsNote" class="note"></div>
  </section>
</div>
<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const FULL = 15, P = 0b0101, Q = 0b0011;          // 位元 i ↔ 5.101 的第 i 個真值可能性
const N = arr => FULL & ~arr.reduce((o, f) => o | f, 0);
const ORDER = ["WWWW","FWWW","WFWW","WWFW","WWWF","FFWW","FWFW","FWWF","WFFW","WFWF","WWFF","FFFW","FFWF","FWFF","WFFF","FFFF"];
const SHORT = ["⊤","~(p∧q)","q→p","p→q","p∨q","~q","~p","p⊻q","p↔q","p","q","~p∧~q","p∧~q","q∧~p","p∧q","⊥"];
const LONG = ["重言式","並非 p 且 q","若 q 則 p","若 p 則 q","p 或 q","非 q","非 p","p 或 q 但非兩者（互斥或）","p 當且僅當 q","p","q","既非 p 也非 q","p 且非 q","q 且非 p","p 且 q","矛盾式"];
const maskOf = s => [...s].reduce((m, c, i) => m | (c === "W" ? 1 << i : 0), 0);
const MASKS = ORDER.map(maskOf);
const idxOf = m => MASKS.indexOf(m);
const dots = m => `<div class="dots">${[0,1,2,3].map(i => `<i style="background:${m >> i & 1 ? "var(--tru)" : "var(--fal)"}"></i>`).join("")}</div>`;

// ---------- BFS 1：逐層（G_{k+1} = G_k ∪ {N(S) : S ⊆ G_k 非空}）
function unions(G) { const U = new Set(); for (const g of G) { for (const u of [...U]) U.add(u | g); U.add(g); } return U; }
const layerOf = new Map([[P, 0], [Q, 0]]), layers = [[P, Q]];
{ let G = new Set([P, Q]);
  while (G.size < 16) {
    const nw = [...unions(G)].map(u => FULL & ~u).filter(f => !G.has(f));
    const uniq = [...new Set(nw)]; uniq.forEach(f => { layerOf.set(f, layers.length); G.add(f); }); layers.push(uniq);
  } }
// 每個新節點找一組最小的「父集合」（取自前面各層）供畫圖
function parentsOf(f) {
  const need = FULL & ~f, L = layerOf.get(f);
  const cand = [...layerOf.keys()].filter(g => layerOf.get(g) < L && (g & ~need) === 0);
  for (let k = 1; k <= cand.length; k++) {
    const pick = [], res = [];
    (function rec(s) { if (res.length) return; if (pick.length === k) { if (pick.reduce((o, g) => o | g, 0) === need) res.push([...pick]); return; }
      for (let i = s; i < cand.length; i++) { pick.push(cand[i]); rec(i + 1); pick.pop(); } })(0);
    if (res.length) return res[0];
  }
  return [];
}
// ---------- BFS 2：最少按鍵次數（狀態＝已生成命題的集合，一步加入一個 N(S)）
const minSteps = new Map([[P, 0], [Q, 0]]), solution = new Map([[P, []], [Q, []]]);
{ const key = s => s, start = (1 << P) | (1 << Q);   // 以 16 位元整數表示狀態
  const dist = new Map([[start, 0]]), prev = new Map(), dq = [start];
  for (let h = 0; h < dq.length && minSteps.size < 16; h++) {
    const s = dq[h], G = []; for (let m = 0; m < 16; m++) if (s >> m & 1) G.push(m);
    for (const u of unions(G)) {
      const f = FULL & ~u; if (s >> f & 1) continue;
      const t = s | (1 << f);
      if (!dist.has(t)) { dist.set(t, dist.get(s) + 1); prev.set(t, [s, f, u]); dq.push(t);
        if (!minSteps.has(f)) { minSteps.set(f, dist.get(t));
          const seq = []; let c = t; while (prev.has(c)) { const [ps, pf, pu] = prev.get(c); seq.unshift([pf, pu, ps]); c = ps; }
          solution.set(f, seq); } }
    }
  } }
// 解答的文字：每一步挑出括號內的命題（用狀態中最少的命題湊出 OR）
function stepText([f, u, s]) {
  const G = []; for (let m = 0; m < 16; m++) if (s >> m & 1 && (m & ~u) === 0) G.push(m);
  let best = null;
  for (let mask = 1; mask < (1 << G.length); mask++) { const S = G.filter((_, i) => mask >> i & 1);
    if (S.reduce((o, g) => o | g, 0) === u && (!best || S.length < best.length)) best = S; }
  return `N(${best.map(g => SHORT[idxOf(g)]).join(", ")}) ＝ ${SHORT[idxOf(f)]}`;
}

// ---------- 遊樂場狀態
let pool, sel, presses, target, gotAt;
function reset() {
  pool = [{ m: P, ex: "p", id: 1 }, { m: Q, ex: "q", id: 2 }]; sel = new Set(); presses = 0; gotAt = new Map([[P, 0], [Q, 0]]);
  $("msg").textContent = ""; renderPool(); renderTargets(); renderStat();
}
function renderPool() {
  $("pool").innerHTML = pool.map((c, i) => `<div class="chip ${sel.has(i) ? "sel" : ""}" data-i="${i}"><div class="top"><span class="nm">${SHORT[idxOf(c.m)]}</span><span class="id">#${c.id}</span></div><div class="top" style="margin-top:4px">${dots(c.m)}</div><div class="ex">${c.ex.length <= 42 ? c.ex : c.short}</div></div>`).join("");
  $("pool").querySelectorAll(".chip").forEach(el => el.onclick = () => { const i = +el.dataset.i; sel.has(i) ? sel.delete(i) : sel.add(i); renderPool(); renderStat(); });
  const k = sel.size; $("bN").disabled = !k;
  $("bN").textContent = k ? `N(${[...sel].map(i => SHORT[idxOf(pool[i].m)]).join(", ")})`.slice(0, 26) : "N( )";
}
function renderStat() {
  $("stat").innerHTML = `已按 N：<b>${presses}</b> 次・已做出 <b>${pool.length}</b>／16 種・已選 <b>${sel.size}</b> 個`;
}
function renderTargets() {
  const show = $("showMin").checked;
  $("targets").innerHTML = MASKS.map((m, i) => `<div class="tc ${gotAt.has(m) ? "got" : ""} ${target === m ? "tgt" : ""}" data-m="${m}" title="${LONG[i]}">${gotAt.has(m) ? `<span class="ck">✓</span>` : ""}${dots(m)}<div class="nm">${SHORT[i]}</div><div class="mn">${show ? `最少 ${minSteps.get(m)} 次・第 ${layerOf.get(m)} 層` : `第 ${i + 1} 號`}</div></div>`).join("");
  $("targets").querySelectorAll(".tc").forEach(el => el.onclick = () => { target = +el.dataset.m; renderTargets(); renderTInfo(false); });
}
function renderTInfo(showSol) {
  if (target == null) return;
  const i = idxOf(target), m = minSteps.get(target);
  let h = `目標：<b>${SHORT[i]}</b>（${LONG[i]}，(${ORDER[i]})(p,q)）。BFS 算出最少 <b>${m}</b> 次，最早在第 <b>${layerOf.get(target)}</b> 層。`;
  if (gotAt.has(target)) h += gotAt.get(target) === 0 ? " 它是起點。" : ` 你在第 <b>${gotAt.get(target)}</b> 次按 N 時做出它${gotAt.get(target) <= m ? "，已經是最少！" : "。"}`;
  h += showSol ? `<div class="sol">${solution.get(target).map((st, k) => `${k + 1}. ${stepText(st)}`).join("<br>") || "（不用按）"}</div>` : ` <button id="bSol" style="min-height:28px;font-size:12px;padding:2px 8px">看一條最短做法</button>`;
  $("tinfo").innerHTML = h;
  const b = $("bSol"); if (b) b.onclick = () => renderTInfo(true);
}
$("bN").onclick = () => {
  const S = [...sel].map(i => pool[i]); const m = N(S.map(c => c.m)); presses++;
  const ex = `N(${S.map(c => c.ex).join(", ")})`, short = `N(${S.map(c => "#" + c.id).join(", ")})`;
  const ex0 = pool.findIndex(c => c.m === m);
  sel.clear();
  if (ex0 >= 0) {
    $("msg").innerHTML = `<span style="color:var(--sub)">得到 ${SHORT[idxOf(m)]}，但已經有了：和 #${pool[ex0].id} 的真值欄相同，就是同一個命題。</span>`;
    renderPool(); const el = $("pool").children[ex0]; el.classList.add("flash"); el.scrollIntoView({ block: "nearest" });
  } else {
    pool.push({ m, ex, short, id: pool.length + 1 }); gotAt.set(m, presses);
    const i = idxOf(m);
    $("msg").innerHTML = `<span style="color:var(--tru)">新命題 #${pool.length}：${SHORT[i]}（${LONG[i]}）</span>` + (m === target ? `<span style="color:var(--gold)">　★ 達成目標！BFS 最少 ${minSteps.get(m)} 次，你用了 ${presses} 次。</span>` : "") + (pool.length === 16 ? `<span style="color:var(--gold)">　16 種全部到齊（最少要 14 次）。</span>` : "");
    renderPool(); $("pool").lastElementChild.scrollIntoView({ block: "nearest" });
  }
  renderStat(); renderTargets(); renderTInfo(false);
};
$("bClr").onclick = () => { sel.clear(); renderPool(); renderStat(); };
$("bReset").onclick = reset;
$("showMin").onchange = renderTargets;

// ---------- 逐層生長圖
const svg = $("svg"), NS = "http://www.w3.org/2000/svg";
const pos = new Map();
layers.forEach((L, k) => { const y = 34 + k * 88; L.forEach((m, j) => pos.set(m, [600 * (j + 1) / (L.length + 1), y])); });
function el(tag, attrs, txt) { const e = document.createElementNS(NS, tag); for (const a in attrs) e.setAttribute(a, attrs[a]); if (txt != null) e.textContent = txt; svg.appendChild(e); return e; }
function drawBFS(upto) {
  svg.innerHTML = "";
  layers.forEach((L, k) => { el("text", { x: 6, y: 34 + k * 88 - 18, fill: "#9A9384", "font-size": 13, "font-family": "Noto Serif TC,serif" }, `第 ${k} 層・${k ? "新增 " : ""}${L.length} 個`); });
  for (let k = 1; k <= upto && k < layers.length; k++) for (const m of layers[k]) for (const g of parentsOf(m)) {
    const [x1, y1] = pos.get(g), [x2, y2] = pos.get(m);
    el("line", { x1, y1: y1 + 13, x2, y2: y2 - 13, stroke: "rgba(142,134,214,.45)", "stroke-width": 1.2 });
  }
  layers.forEach((L, k) => L.forEach(m => { if (k > upto) return; const [x, y] = pos.get(m), i = idxOf(m);
    el("circle", { cx: x, cy: y, r: 13, fill: m === FULL ? "#D4A84B" : m === 0 ? "#3a2620" : "#1C1F26", stroke: k === upto ? "#8E86D6" : "#2A2D35", "stroke-width": 1.5 });
    el("text", { x, y: y + 27, fill: "#EDE6D6", "font-size": 13, "text-anchor": "middle", "font-family": "JetBrains Mono,monospace" }, SHORT[i]);
    for (let b = 0; b < 4; b++) el("circle", { cx: x - 7.5 + b * 5, cy: y, r: 2, fill: m >> b & 1 ? "#5FB8A6" : "#C9644A" });
  }));
  const tot = layers.slice(0, upto + 1).reduce((s, L) => s + L.length, 0);
  $("bfsNote").textContent = upto >= layers.length - 1
    ? `${layers.length - 1} 層集齊全部 16 種（各層新增 ${layers.slice(1).map(L => L.length).join("、")} 個）。線表示一組最小的括號內容；重言式（金色）要等矛盾式（暗紅）出現後才能做出。`
    : `第 ${upto} 層：累計 ${tot}／16 種。`;
  document.querySelectorAll(".tc").forEach(c => c.classList.toggle("bfs", layerOf.get(+c.dataset.m) <= upto && upto > 0));
}
let timer = null;
$("bBFS").onclick = () => {
  clearTimeout(timer); let k = 0; drawBFS(0);
  const tick = () => { k++; drawBFS(k); if (k < layers.length - 1) timer = setTimeout(tick, 1100); };
  timer = setTimeout(tick, 700);
};

reset(); drawBFS(0);
window.__N = { layers, minSteps, layerOf };   // 給驗算用
})();
</script>
</body>
</html>
